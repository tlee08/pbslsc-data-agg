[project]
name = "data-wrangling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo[lsp,recommended]>=0.24.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=1.38.1",
    "pydantic>=2.0.0",
    "seaborn>=0.13.2",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = ["ruff>=0.15.2"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.marimo.runtime]
pythonpath = ["src"]
